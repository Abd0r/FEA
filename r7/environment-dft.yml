# Environment used for every DFT result in FEA-R7 (macOS arm64, Apple M2, 8 cores).
# conda/mamba/micromamba:  micromamba create -f environment-dft.yml && micromamba activate fea-dft
name: fea-dft
channels: [conda-forge]
dependencies:
  - python=3.12
  - gpaw=26.7.0=*openmpi*
  - ase=3.29.0
  - openmpi=5.0.11
  - libxc=7.1.2
  - numpy=2.5.5
  - matplotlib
